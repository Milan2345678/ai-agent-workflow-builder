version: 3
metadata:
  version: 3
  sources:
    - name: default
      kind: postgres
      tables:
        - table:
            schema: public
            name: organizations
        - table:
            schema: public
            name: organization_members
        - table:
            schema: public
            name: workflows
        - table:
            schema: public
            name: workflow_steps
        - table:
            schema: public
            name: workflow_triggers
        - table:
            schema: public
            name: workflow_runs
        - table:
            schema: public
            name: step_runs
      configuration:
        connection_info:
          database_url:
            from_env: PG_DATABASE_URL
          pool_settings:
            max_connections: 50
            idle_timeout: 180
            retry_delay: 5
            pool_timeout: 30
  actions:
    - name: triggerWorkflowRun
      definition:
        kind: synchronous
        handler: http://host.docker.internal:3000/api/hasura/actions/trigger-workflow-run
        forward_client_headers: true
        timeout: 60
        headers:
          - name: content-type
            value: application/json
        arguments:
          - name: workflowId
            type: uuid
          - name: input
            type: jsonb
        output_type: TriggerWorkflowRunOutput
    - name: approveStep
      definition:
        kind: synchronous
        handler: http://host.docker.internal:3000/api/hasura/actions/approve-step
        forward_client_headers: true
        timeout: 60
        headers:
          - name: content-type
            value: application/json
        arguments:
          - name: runId
            type: uuid
          - name: stepId
            type: uuid
          - name: approval
            type: jsonb
        output_type: ApproveStepOutput
  custom_types:
    objects:
      - name: TriggerWorkflowRunOutput
        fields:
          - name: runId
            type: uuid
          - name: status
            type: String
      - name: ApproveStepOutput
        fields:
          - name: runId
            type: uuid
          - name: status
            type: String
